spring:
  application:
    name: routewise-api
  datasource:
    url: jdbc:h2:mem:routewise;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  # 8080 is often taken by other local services; override with SERVER_PORT.
  port: ${SERVER_PORT:8087}
  error:
    include-stacktrace: never

routewise:
  cors:
    allowed-origins: ${ROUTEWISE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
