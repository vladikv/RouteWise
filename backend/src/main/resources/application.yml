spring:
  application:
    name: routewise-api
  datasource:
    url: jdbc:h2:mem:routewise;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  # 8080 is often taken by other local services; override with SERVER_PORT.
  port: ${SERVER_PORT:8087}
  error:
    include-stacktrace: never

routewise:
  weather:
    # Open-Meteo: free, no API key. Forecasts reach at most 16 days ahead.
    base-url: ${ROUTEWISE_WEATHER_BASE_URL:https://api.open-meteo.com}
    connect-timeout: 2s
    read-timeout: 3s
  advisor:
    # Optional. Without a key the advisor uses its built-in rules.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ROUTEWISE_ADVISOR_MODEL:claude-opus-5-5}
    effort: ${ROUTEWISE_ADVISOR_EFFORT:low}
    timeout: 20s
    max-retries: 1
  cors:
    allowed-origins: ${ROUTEWISE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
