<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RouteWise</title>
    <meta
      name="description"
      content="Compare train, bus, car, bike and plane by travel time, cost and CO₂."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- Sets data-theme before the first paint (no flash). Same key and values as ThemeService
         (core/theme/theme.ts): 'light' | 'dark' | 'system'; anything else means system. -->
    <script>
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('routewise.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (theme === 'system') {
          theme =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <!-- Manrope is the app's only font; the system font stack is the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
