<header class="header">
  <div class="header__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M7 17L17 7M9 7h8v8" />
        </svg>
      </span>
      RouteWise
    </a>

    <div class="header__nav">
      <app-pill-nav [items]="navItems" ariaLabel="Main" />
    </div>

    <div class="header__actions">
      @if (session.user(); as user) {
        <div class="menu menu--account" data-menu="account">
          <button
            #avatarButton
            type="button"
            class="avatar"
            aria-label="Account menu"
            aria-controls="account-menu"
            [attr.aria-expanded]="open() === 'account'"
            (click)="toggle('account')"
          >
            <span aria-hidden="true">{{ initials() }}</span>
          </button>
          @if (open() === 'account') {
            <div class="dropdown" id="account-menu">
              <p class="dropdown__name">
                <span class="visually-hidden">Logged in as </span>{{ user.displayName }}
              </p>
              <button type="button" class="button" (click)="logout()">Log out</button>
            </div>
          }
        </div>
      } @else {
        <a class="login button" routerLink="/login">Log in</a>
      }

      <div class="menu menu--nav" data-menu="nav">
        <app-icon-button
          #menuButton
          label="Menu"
          controls="nav-menu"
          [expanded]="open() === 'nav'"
          (click)="toggle('nav')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </app-icon-button>
        @if (open() === 'nav') {
          <div class="dropdown" id="nav-menu">
            <app-pill-nav [items]="navItems" ariaLabel="Main" />
            @if (session.user(); as user) {
              <p class="dropdown__name">
                <span class="visually-hidden">Logged in as </span>{{ user.displayName }}
              </p>
              <button type="button" class="button" (click)="logout()">Log out</button>
            } @else {
              <a class="button" routerLink="/login">Log in</a>
            }
          </div>
        }
      </div>
    </div>
  </div>
</header>
