<header class="header">
  <div class="header__inner">
    <div class="header__start">
      <a class="brand" routerLink="/">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7 17L17 7M9 7h8v8" />
          </svg>
        </span>
        RouteWise
      </a>
      @if (layoutToggleShown()) {
        <app-segmented-toggle
          ariaLabel="Home layout"
          [showCheck]="false"
          [options]="layoutOptions"
          [value]="homeLayout.preference()"
          (valueChange)="homeLayout.set($event)"
        />
      }
    </div>

    <div class="header__nav">
      <app-pill-nav [items]="navItems" ariaLabel="Main" />
    </div>

    <div class="header__actions">
      <div class="header__tools">
        <button
          type="button"
          class="round"
          aria-label="Search trips"
          title="Search trips"
          (click)="searchTrips()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l4.5 4.5" />
          </svg>
        </button>
        <a class="round" routerLink="/trips/new" aria-label="New trip" title="New trip">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </a>
      </div>

      @if (session.user(); as user) {
        <app-menu class="menu menu--account" panelId="account-menu">
          <button type="button" class="avatar" menuTrigger aria-label="Account menu">
            <span aria-hidden="true">{{ initials() }}</span>
          </button>
          <ng-template appMenuContent>
            <div class="group">
              <p class="dropdown__name">
                <span class="visually-hidden">Logged in as </span>{{ user.displayName }}
              </p>
              <button type="button" class="button" (click)="logout()">Log out</button>
            </div>
          </ng-template>
        </app-menu>
      } @else {
        <a class="login button" routerLink="/login">Log in</a>
      }

      <app-menu class="menu menu--nav" label="Menu" panelId="nav-menu">
        <svg menuIcon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <ng-template appMenuContent>
          <div class="group">
            <app-pill-nav [items]="navItems" ariaLabel="Main" />
            @if (session.user(); as user) {
              <p class="dropdown__name">
                <span class="visually-hidden">Logged in as </span>{{ user.displayName }}
              </p>
              <button type="button" class="button" (click)="logout()">Log out</button>
            } @else {
              <a class="button" routerLink="/login">Log in</a>
            }
          </div>
        </ng-template>
      </app-menu>
    </div>
  </div>
</header>
